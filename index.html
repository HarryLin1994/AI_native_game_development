<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Photo Character Lab MVP</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Local MVP</p>
          <h1>Photo Character Lab</h1>
        </div>
        <div class="topbar-status" id="privacyStatus">本機卡牌生成</div>
      </header>

      <main class="workspace">
        <section class="tool-panel capture-panel" aria-labelledby="captureTitle">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Photo Input</p>
              <h2 id="captureTitle">卡牌生成</h2>
            </div>
            <span class="pill" id="analysisState">等待素材</span>
          </div>

          <div class="capture-frame">
            <img id="imagePreview" alt="角色來源照片預覽" />
            <video id="cameraFeed" playsinline muted></video>
            <div class="empty-state" id="emptyState">
              <strong>上傳照片或啟動相機</strong>
              <span>影像會留在這台裝置</span>
            </div>
          </div>

          <div class="control-grid">
            <label class="file-button">
              <input id="imageInput" type="file" accept="image/*" />
              上傳照片
            </label>
            <button id="cameraButton" type="button">開啟相機</button>
            <button id="captureButton" type="button" disabled>拍攝</button>
            <button id="visionTagsButton" type="button" disabled>VLM 解析</button>
            <button id="summonButton" type="button" disabled>生成卡牌</button>
          </div>

          <div class="semantic-review">
            <label class="field semantic-field">
              <span>VLM 語意候選</span>
              <textarea
                id="semanticTagsInput"
                maxlength="180"
                placeholder="VLM 下一步自動產生；目前可校準：basketball court, athlete, post-game energy"
              ></textarea>
            </label>
          </div>

          <div hidden>
            <input id="sigilInput" type="text" maxlength="42" value="" />
            <select id="ageInput">
              <option value="young_adult" selected>青年</option>
            </select>
            <input id="occupationInput" type="text" maxlength="36" value="" />
            <textarea id="featureInput" maxlength="96"></textarea>
            <select id="combatStyleInput">
              <option value="auto" selected>自動判定</option>
            </select>
            <select id="cardMoodInput">
              <option value="cinematic" selected>電影感</option>
            </select>
            <select id="characterFormInput">
              <option value="humanlike" selected>真人 / 人形</option>
              <option value="animalized.cat">貓主體</option>
            </select>
            <select id="imageModeInput">
              <option value="local" selected>本機預覽，不呼叫 AI</option>
              <option value="gemini">Google Gemini / Nano Banana 生圖</option>
              <option value="comfy">本機 ComfyUI 生圖</option>
              <option value="openai">OpenAI 圖片 API</option>
            </select>
            <textarea id="backstoryInput" maxlength="120"></textarea>
            <select id="valueInput">
              <option value="growth" selected>成長</option>
            </select>
            <input id="signatureItemInput" type="text" maxlength="36" value="" />
            <input id="weaknessInput" type="text" maxlength="80" value="" />
            <select id="placeTypeInput">
              <option value="neutral" selected>中性訓練場</option>
            </select>
            <select id="timeMoodInput">
              <option value="clear" selected>清晰日常</option>
            </select>
          </div>

          <div class="analysis-grid" id="analysisGrid" hidden></div>
        </section>

        <section class="card-stage" aria-label="生成卡牌">
          <article class="game-card empty-card" id="cardPreview">
            <div class="card-art placeholder-art"></div>
            <div class="card-body">
              <div class="card-title-row">
                <div>
                  <p class="card-kicker">Battle Card</p>
                  <h2>尚未生成</h2>
                </div>
                <span class="rarity-badge">N</span>
              </div>
              <p class="card-lore">選擇照片後，戰鬥卡牌會在這裡成形。</p>
            </div>
          </article>

          <div class="card-actions">
            <button id="saveCardButton" type="button" disabled>保存卡牌</button>
            <button id="rerollButton" type="button" disabled>重鑄卡牌</button>
          </div>
        </section>

        <section class="tool-panel battle-panel" aria-labelledby="battleTitle">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Battle Test</p>
              <h2 id="battleTitle">卡牌戰鬥測試</h2>
            </div>
            <span class="pill" id="battleState">未開戰</span>
          </div>

          <div class="fighters">
            <div class="fighter" id="playerFighter">
              <span class="fighter-label">Player</span>
              <strong>未選擇</strong>
              <div class="hp-track"><span></span></div>
              <small>HP 0 / 0</small>
            </div>
            <div class="versus">VS</div>
            <div class="fighter enemy" id="enemyFighter">
              <span class="fighter-label">CPU</span>
              <strong>等待中</strong>
              <div class="hp-track"><span></span></div>
              <small>HP 0 / 0</small>
            </div>
          </div>

          <div class="battle-controls">
            <button id="startBattleButton" type="button" disabled>開始對戰</button>
            <button id="attackButton" type="button" disabled>普攻</button>
            <button id="skillOneButton" type="button" disabled>技能一</button>
            <button id="skillTwoButton" type="button" disabled>技能二</button>
            <button id="guardButton" type="button" disabled>防禦</button>
          </div>

          <ol class="battle-log" id="battleLog" aria-live="polite"></ol>
        </section>

        <section class="tool-panel deck-panel" aria-labelledby="deckTitle">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Cards</p>
              <h2 id="deckTitle">本機卡牌庫</h2>
            </div>
            <span class="pill" id="deckCount">0 張</span>
          </div>
          <div class="deck-list" id="deckList"></div>
        </section>
      </main>
    </div>

    <div class="modal-overlay" id="branchChoiceModal" hidden>
      <section
        class="branch-choice-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="branchChoiceTitle"
        aria-describedby="branchChoiceSubtitle"
      >
        <div class="branch-choice-heading">
          <div>
            <p class="eyebrow">Evolution</p>
            <h2 id="branchChoiceTitle">進化分支選擇</h2>
            <p id="branchChoiceSubtitle">選擇一條成長路線</p>
          </div>
          <span class="pill" id="branchChoiceSlot">Skill Branch</span>
        </div>
        <div class="branch-choice-options" id="branchChoiceOptions"></div>
        <p class="branch-choice-note" id="branchChoiceNote"></p>
      </section>
    </div>

    <canvas id="analysisCanvas" width="128" height="128" hidden></canvas>
    <script src="app.js" type="module"></script>
  </body>
</html>
